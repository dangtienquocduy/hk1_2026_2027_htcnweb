<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Date Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .form-container {
            border: 2px solid #5b9bd5;
            padding: 15px 20px 20px 20px;
            width: 290px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
        }
        input[type="text"], input[type="tel"], input[type="email"] {
            width: 100%;
            padding: 3px 5px;
            box-sizing: border-box;
            border: 1px solid #7f7f7f;
        }
        input[type="color"] {
            width: 50px;
            height: 24px;
            border: 1px solid #7f7f7f;
            background: none;
        }

        /* Ô hiển thị ngày */
        .fake-date-input {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #3385ff;
            background: #eaf2ff;
            padding: 3px 6px;
            font-size: 13px;
        }

        /* Khung lịch */
        .calendar-box {
            border: 1px solid #a6a6a6;
            background: #ffffff;
            margin-top: 2px;
            padding: 6px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            font-size: 11px;
            user-select: none;
        }
        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .cal-nav button {
            padding: 1px 6px;
            font-size: 10px;
            cursor: pointer;
        }
        .cal-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        .cal-table th {
            background-color: #dbe5f1;
            font-weight: normal;
            padding: 3px 0;
            font-size: 10px;
        }
        .cal-table td {
            padding: 4px 1px;
            border: 1px solid #e0e0e0;
            cursor: pointer;
        }
        .cal-table td:hover {
            background-color: #d2e4f7;
        }
        .other-month {
            color: #aaaaaa;
        }
        .selected-day {
            background-color: #9dbbda !important;
            font-weight: bold;
        }
        .button-center {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <form action="#" method="post">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" name="name">
            </div>

            <div class="form-group">
                <label>Telephone Number:</label>
                <input type="tel" name="tel">
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email">
            </div>

            <div class="form-group">
                <label>Favorite Color:</label>
                <input type="color" value="#0000ff">
            </div>

            <div class="form-group">
                <label>Date of Birth:</label>
                
                <input type="hidden" name="dob" id="dob-hidden" value="2015-07-16">
                
                <div class="fake-date-input">
                    <span id="date-display">07/16/2015</span>
                    <span style="font-size: 10px; color: #555;">✖ &#9662;</span>
                </div>

                <div class="calendar-box">
                    <div class="cal-header">
                        <span><strong id="month-year-label">July 2015 &#9662;</strong></span>
                        <div class="cal-nav">
                            <button type="button" id="prev-month">&#9664;</button>
                            <button type="button" id="today-btn">&#8226;</button>
                            <button type="button" id="next-month">&#9654;</button>
                        </div>
                    </div>

                    <table class="cal-table">
                        <thead>
                            <tr>
                                <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
                            </tr>
                        </thead>
                        <tbody id="calendar-days">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="button-center">
                <input type="submit" value="Submit">
            </div>
        </form>
    </div>

    <script>
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        
        let selectedDate = new Date(2015, 6, 16);
        let viewDate = new Date(selectedDate);

        function renderCalendar() {
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();

            document.getElementById('month-year-label').innerHTML = `${monthNames[month]} ${year} &#9662;`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const tbody = document.getElementById('calendar-days');
            tbody.innerHTML = '';

            let row = document.createElement('tr');
            let dayCount = 0;

            for (let i = firstDay - 1; i >= 0; i--) {
                const cell = document.createElement('td');
                cell.className = 'other-month';
                cell.textContent = daysInPrevMonth - i;
                cell.addEventListener('click', () => {
                    viewDate.setMonth(month - 1);
                    selectDay(year, month - 1, daysInPrevMonth - i);
                });
                row.appendChild(cell);
                dayCount++;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                if (dayCount === 7) {
                    tbody.appendChild(row);
                    row = document.createElement('tr');
                    dayCount = 0;
                }

                const cell = document.createElement('td');
                cell.textContent = day;

                if (selectedDate.getFullYear() === year && selectedDate.getMonth() === month && selectedDate.getDate() === day) {
                    cell.className = 'selected-day';
                }

                cell.addEventListener('click', () => {
                    selectDay(year, month, day);
                });

                row.appendChild(cell);
                dayCount++;
            }

            let nextDay = 1;
            while (dayCount < 7) {
                const cell = document.createElement('td');
                cell.className = 'other-month';
                cell.textContent = nextDay;
                const d = nextDay;
                cell.addEventListener('click', () => {
                    viewDate.setMonth(month + 1);
                    selectDay(year, month + 1, d);
                });
                row.appendChild(cell);
                dayCount++;
                nextDay++;
            }
            tbody.appendChild(row);
        }

        function selectDay(y, m, d) {
            selectedDate = new Date(y, m, d);
            viewDate = new Date(selectedDate);

            const formattedMonth = String(selectedDate.getMonth() + 1).padStart(2, '0');
            const formattedDay = String(selectedDate.getDate()).padStart(2, '0');
            const formattedYear = selectedDate.getFullYear();

            document.getElementById('date-display').textContent = `${formattedMonth}/${formattedDay}/${formattedYear}`;
            document.getElementById('dob-hidden').value = `${formattedYear}-${formattedMonth}-${formattedDay}`;

            renderCalendar();
        }

        document.getElementById('prev-month').addEventListener('click', () => {
            viewDate.setMonth(viewDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('next-month').addEventListener('click', () => {
            viewDate.setMonth(viewDate.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById('today-btn').addEventListener('click', () => {
            viewDate = new Date(selectedDate);
            renderCalendar();
        });

        renderCalendar();
    </script>

</body>
</html>
